name: Build APK and publish release

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "LICENSE.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Stockfish 16 network (40 MB) is no longer bundled: the app downloads it once on first run (Stockfish 11 plays until then).

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unit tests (a failing test stops the release)
        run: gradle testDebugUnitTest --no-daemon

      # The README's generated blocks (version, clip and test counts, skill packs, new files) and the Release text
      # (the newest CHANGELOG section) are rewritten here, so neither has to be edited by hand for an update.
      - name: Refresh README and release notes
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: python3 tools/update_readme.py --notes

      - name: Use my own signing key (only if the secrets exist)
        env:
          KS_B64: ${{ secrets.CAPRI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "CAPRI_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "CAPRI_KEYSTORE_PASSWORD=${{ secrets.CAPRI_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "CAPRI_KEY_ALIAS=${{ secrets.CAPRI_KEY_ALIAS }}" >> "$GITHUB_ENV"
          else
            echo "No private key set: using the public key from the repo."
          fi

      - name: Build the release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: |
          VERSION="0.5.${{ github.run_number }}"
          mkdir -p dist
          ls -la app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/*arm64-v8a*.apk "dist/Capri-${VERSION}-arm64.apk"
          cp app/build/outputs/apk/release/*armeabi-v7a*.apk "dist/Capri-${VERSION}-arm32.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Capri-apk
          path: dist/*.apk

      # Only real pushes to the main branch publish a Release (not pull requests).
      - name: Publish to Releases
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.apk.outputs.version }}" dist/*.apk \
            --title "Capri ${{ steps.apk.outputs.version }}" \
            --notes-file dist/release-notes.md \
            --target "${{ github.sha }}" \
            --latest

      # Commit the refreshed README back. Pushes made with the built-in token do not start another run, and *.md changes are ignored anyway.
      - name: Commit the refreshed README
        continue-on-error: true
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "README: refresh generated blocks [skip ci]" && git push)
